name: Verify game
# 4.9.0-rc.21: ta sama kontrola co przed wydaniem na telefonie (npm run test:install, symulacja działania, integralność paczki),
# ale podzielona na 8 równoległych części. Długie scenariusze 1500 dni z epoki IV idą osobno, tylko dla main.
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Testy ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: node tools/check-build.cjs
      - run: node tools/run-tests-serial.cjs --install --shard=${{ matrix.shard }}/8
  package:
    name: Symulacja i paczka
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: node tools/check-build.cjs
      - run: npm run test:runtime
      # manifest paczki powstaje przy wydaniu, więc integralność ma sens dla commitów wydania i dla main
      - if: github.ref == 'refs/heads/main' || startsWith(github.event.head_commit.message, '4.')
        run: node tools/verify-package.cjs
  browser:
    name: Przeglądarka ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [mobile-ui, ai, navigation, master, e4, hardening, lifecycle, people, supply, tasks, workspace]
    env:
      PRZYSTAN_START_SERVER: '1'
      PRZYSTAN_BROWSER_OUTPUT: browser-evidence
      PRZYSTAN_CHROMIUM_ARGS: '["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader","--ignore-gpu-blocklist"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # jedno powtórzenie: test, który przechodzi dopiero za drugim razem, jest widoczny w logu jako „powtórka”
      - run: node tools/browser-${{ matrix.tool }}.cjs || (echo "powtórka ${{ matrix.tool }}" && node tools/browser-${{ matrix.tool }}.cjs)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.tool }}
          path: browser-evidence
  node18:
    name: Zgodność z Node 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm run build
      - run: npm run test:runtime
  generations:
    name: Długie scenariusze epoki IV
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: node --test tests/e4-population.test.mjs
